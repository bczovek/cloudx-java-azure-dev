spring:
  application:
    name: petstoreorderservice
  main:
    allow-bean-definition-overriding: true
server:
  port: ${PETSTOREORDERSERVICE_SERVER_PORT:8080}

petstore:
  service:
    product:
      url: ${PETSTOREPRODUCTSERVICE_URL:http://localhost:8082}
    orderservicebus:
      fqNamespace: ${ORDERSERVICEBUS_FQ_NAMESPACE}
      queueName: ${ORDERSERVICEBUS_QUEUE_NAME:orders}
    order:
      cosmosdb:
        url: ${ORDERDATABASE_URL}
        name: ${ORDERDATABASE_NAME}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    ssl:
      enabled: false
    diskspace:
      enabled: false

logging:
  level:
    root: INFO
    com.chtrembl: DEBUG
